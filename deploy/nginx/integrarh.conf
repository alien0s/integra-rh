# nginx — integrarh.aceam.org.br
#
# Serve o build estático de apps/web (copiado pra /var/www/integrarh — nginx
# roda como www-data, que não alcança /home/inovacao, daí a cópia) e repassa
# /api/* pra API Fastify rodando em 127.0.0.1:3000 (gerenciada pelo PM2, ver
# ecosystem.config.cjs na raiz do repo), removendo o prefixo "/api" — mesmo
# comportamento do proxy do Vite em dev.
#
# Instalação (ver deploy/README.md pro passo a passo completo):
#   sudo cp deploy/nginx/integrarh.conf /etc/nginx/sites-available/integrarh
#   sudo ln -s /etc/nginx/sites-available/integrarh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name integrarh.aceam.org.br;

    root /var/www/integrarh;
    index index.html;

    # Proxy da API — remove o prefixo /api (equivalente ao rewrite do Vite).
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade/Connection: necessário se algum endpoint usar SSE/websocket
        # (o front usa SSE pra notificações em tempo real).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Assets com hash no nome (Vite) — cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    # (o roteamento de verdade é feito no client, via react-router-dom).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
