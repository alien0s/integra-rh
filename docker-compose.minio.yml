# MinIO — object storage compatível com S3 para o ERP.
# Subir:    docker compose -f docker-compose.minio.yml up -d
# Console:  http://localhost:9001  (login: usuário/senha definidos abaixo)
# API S3:   http://localhost:9000  (usada pela API via S3_ENDPOINT)
services:
  minio:
    image: minio/minio:latest
    container_name: erp-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
